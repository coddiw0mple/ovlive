[project]
name = "ovlive"
version = "0.1.0"
description = "Live trams and buses in Dutch cities, built on open OV data (OVapi GTFS + GTFS-Realtime)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0.0",
    # Only the build step (pipeline/) uses DuckDB; the live API never imports it.
    "duckdb>=1.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Runs on every deployment: download today's timetable and write public/data/.
build = "python -m pipeline"
